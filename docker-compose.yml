services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tesis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesis"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    env_file: .env
    environment:
      EXPERIMENTAL_PMUM_SERVICE_URL: ${EXPERIMENTAL_PMUM_SERVICE_URL:-http://host.docker.internal:8765}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

